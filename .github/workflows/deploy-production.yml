# Deploy icbu-listing to Vercel production whenever videos-dataset updates.
name: Deploy Production

on:
  push:
    branches: [videos-dataset]
    paths:
      - "icbu-listing/**"
      - ".github/workflows/deploy-production.yml"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: icbu-listing
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (production)
        id: deploy
        env:
          VERCEL_ORG_ID: team_pJEBORGMkWVWXNDb2bbDZ4Hx
          VERCEL_PROJECT_ID: prj_IVAszltpWeYhbwVh9BdiBGPO8vuF
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret is missing — skipping auto-deploy."
            echo "Add it in repo Settings → Secrets and Actions, or run ./scripts/deploy-production.sh locally."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx vercel@59 deploy --prod --token "$VERCEL_TOKEN" --yes
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Verify production health
        env:
          DEPLOYED: ${{ steps.deploy.outputs.deployed }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 12); do
            body=$(curl -fsS "https://icbu-listing.vercel.app/api/v1/health" || true)
            echo "$body" | head -c 400
            echo
            sha=$(echo "$body" | python3 -c "import sys,json; print(json.load(sys.stdin).get('git_sha',''))" 2>/dev/null || true)
            ok=$(echo "$body" | python3 -c "import sys,json; print('yes' if json.load(sys.stdin).get('ok') else 'no')" 2>/dev/null || echo "no")
            if [ "$ok" != "yes" ] || [ -z "$sha" ]; then
              sleep 15
              continue
            fi
            if [ "$DEPLOYED" = "true" ] && [ "$sha" = "$EXPECTED_SHA" ]; then
              echo "Production git_sha matches push: $sha"
              exit 0
            fi
            if [ "$DEPLOYED" != "true" ]; then
              echo "Auto-deploy skipped (no VERCEL_TOKEN). Production healthy at git_sha=$sha"
              exit 0
            fi
            sleep 15
          done
          if [ "$DEPLOYED" = "true" ]; then
            echo "::error::Production git_sha did not match $EXPECTED_SHA within 3 minutes."
            exit 1
          fi
          echo "::error::Production health check failed."
          exit 1

      - name: Verify Feed bundle marker
        run: |
          index=$(curl -fsS "https://icbu-listing.vercel.app/" | grep -oE 'assets/index-[^"]+\.js' | head -1)
          test -n "$index"
          curl -fsS "https://icbu-listing.vercel.app/$index" | grep -q 'Feed-'
          echo "Feed lazy chunk referenced in $index"
