<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  .wrap { width: 1200px; }
  text { font-family: "Helvetica Neue", Helvetica, Arial, "WenQuanYi Micro Hei", "Droid Sans Fallback", sans-serif; }
  .t { font-size: 15px; font-weight: 700; fill: #1f2328; }
  .s { font-size: 12.5px; fill: #6b7280; }
  .m { font-size: 12.5px; fill: #1f2328; font-family: Menlo, Consolas, monospace; }
  .step { font-size: 13px; font-weight: 700; fill: #e62828; }
</style>
</head>
<body>
<div class="wrap">
  <div class="caption">
    <h1>公网部署链路：域名 → 服务器 → HTTPS → 容器</h1>
    <p>LINE 只接受 HTTPS + 受信任 CA 证书的 webhook 地址，所以必须有域名；Caddy 会自动申请并续期 Let's Encrypt 证书，是最省事的一条路</p>
  </div>
  <svg width="1200" height="520" viewBox="0 0 1200 520" class="frame" style="background:#fff;display:block">
    <defs>
      <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <path d="M0,0 L0,6 L9,3 z" fill="#9aa2ad"/>
      </marker>
    </defs>

    <rect x="40" y="120" width="200" height="120" rx="10" fill="#fff" stroke="#cfd4da"/>
    <text x="60" y="150" class="step">① 域名商 / DNS</text>
    <text x="60" y="176" class="t">line.example.com</text>
    <text x="60" y="198" class="m">A 记录 → 1.2.3.4</text>
    <text x="60" y="220" class="s">解析生效后再申请证书</text>

    <rect x="300" y="80" width="200" height="200" rx="10" fill="#fff" stroke="#cfd4da"/>
    <text x="320" y="110" class="step">② 云服务器 VPS</text>
    <text x="320" y="136" class="t">1 核 1G 起步够用</text>
    <text x="320" y="160" class="s">Ubuntu 22.04 / 24.04</text>
    <text x="320" y="184" class="s">安全组放行 80 / 443</text>
    <text x="320" y="208" class="s">关闭 22 端口口令登录</text>
    <text x="320" y="232" class="s">建议选日本 / 新加坡节点</text>
    <text x="320" y="256" class="s">（离 LINE 平台近，延迟低）</text>

    <rect x="560" y="60" width="240" height="240" rx="10" fill="#fbfcfd" stroke="#cfd4da"/>
    <text x="580" y="90" class="step">③ Caddy 反向代理</text>
    <text x="580" y="116" class="t">自动 HTTPS</text>
    <text x="580" y="140" class="s">首次启动自动向 Let's</text>
    <text x="580" y="160" class="s">Encrypt 申请证书并续期</text>
    <text x="580" y="188" class="m">:443 → line-hub:8000</text>
    <text x="580" y="216" class="s">证书必须是公网 CA 签发</text>
    <text x="580" y="236" class="s">自签证书 LINE 一律拒收</text>
    <text x="580" y="266" class="s">也可换成 Nginx + certbot</text>

    <rect x="860" y="60" width="300" height="240" rx="10" fill="#fff" stroke="#cfd4da"/>
    <text x="880" y="90" class="step">④ line-hub 应用容器</text>
    <text x="880" y="116" class="m">uvicorn / FastAPI :8000</text>
    <text x="880" y="144" class="s">读取 .env 里 5 套密钥</text>
    <text x="880" y="168" class="m">/webhook/acc1 … /webhook/acc5</text>
    <text x="880" y="196" class="m">/healthz　健康检查</text>
    <text x="880" y="224" class="s">docker compose up -d 启动</text>
    <text x="880" y="248" class="s">restart: unless-stopped 自愈</text>
    <text x="880" y="276" class="s">日志按账号打 tag，方便排查</text>

    <path d="M240 180 L 296 180" stroke="#9aa2ad" marker-end="url(#a)"/>
    <path d="M500 180 L 556 180" stroke="#9aa2ad" marker-end="url(#a)"/>
    <path d="M800 180 L 856 180" stroke="#06c755" stroke-width="2" marker-end="url(#a)"/>

    <rect x="40" y="340" width="1120" height="140" rx="10" fill="#fffaf5" stroke="#f0c9a8"/>
    <text x="64" y="372" class="t">上线前自检清单</text>
    <text x="64" y="400" class="s">1. curl -I https://line.example.com/healthz 返回 200，且证书链完整（curl 不报 SSL 错）</text>
    <text x="64" y="424" class="s">2. 五个 channel 的 Webhook URL 各自填对路径，逐个点 Verify 出现 Success，Use webhook 全部打开</text>
    <text x="64" y="448" class="s">3. 故意用错 secret 发一次请求，服务端应返回 403 —— 说明验签真的生效了，而不是照单全收</text>
    <text x="64" y="470" class="s">4. 五个官方账号各自加好友发一条消息，日志里能看到对应 acc 标签，且能收到回复</text>
  </svg>
</div>
</body>
</html>
